<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256,256) scale(2.5) translate(-100,-100)">
    <!-- Left vertical bar with upward arrow -->
    <line x1="65" y1="145" x2="65" y2="55" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
    <polyline points="45,80 65,55 85,80" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right vertical bar with downward arrow -->
    <line x1="135" y1="55" x2="135" y2="145" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
    <polyline points="115,120 135,145 155,120" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Horizontal connector (the H crossbar) -->
    <line x1="65" y1="100" x2="135" y2="100" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>